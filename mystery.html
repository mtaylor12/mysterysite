<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mystery Screensaver</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: black;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain; /* use cover to crop and fill the screen */
    }
  </style>
</head>
<body>
  <!-- <video autoplay loop playsinline controls>
    <source src="./mysteryshortmp4.mp4" type="video/mp4">
    Your browser can't play this video.
  </video>

  <video id="screensaver" muted loop playsinline>
  <source src="./mysteryshortmp4.mp4" type="video/mp4">
</video> -->

<script>
  const video = document.getElementById("screensaver");

  setTimeout(() => {
    video.play().catch(error => {
      console.log("Autoplay was blocked:", error);
    });
  }, 10 * 60 * 1000); // 10 minutes
</script>

</body>
</html>
